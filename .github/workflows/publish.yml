name: Publish Packages

# Publishes the v* tag the run starts from (security audit SEC-044). A release
# event runs on its tag; to re-publish by hand, dispatch ON the tag:
# `gh workflow run publish.yml --ref v1.249.0 -f packages=npm`. There is no
# version input: a dispatch from main used to publish main HEAD under any
# version it was given.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (comma-separated: npm,pypi,cargo,dart,maven,go)'
        required: false
        default: 'all'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.21'
  JAVA_VERSION: '17'

# Least privilege (security audit SEC-042/SEC-044): the workflow token gets
# nothing by default and every job names exactly the scopes it needs.
permissions: {}

jobs:
  # ============================================
  # Release integrity - refuse to publish a poisoned tree
  # (2026-08-27: a merge shipped unresolved conflict blocks in 55 tracked
  #  files, including dist/manifest.json and package.json)
  # ============================================
  release-integrity:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # Shallow (default depth-1) checkout: --all reads the tracked files at
      # HEAD and never needs history. A fetch-depth:0 clone of this repo
      # (8.7 GB) hung here for 30+ min on v1.239.0, as it did for the PHP job
      # on v1.177.0 (sds-publish-php-checkout-hang).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check release integrity
        run: node ./scripts/check-release-integrity.mjs --all

      # Supply-chain gate on the workflows themselves (security audit
      # SEC-042/SEC-044): SHA-pinned actions, least-privilege tokens, no
      # curl|sh or @latest, secrets only in deployment environments.
      - name: Check workflow hardening
        run: |
          node ./scripts/check-workflow-hardening.mjs
          node --test ./scripts/check-workflow-hardening.test.mjs ./scripts/publish-gates.test.mjs

  # ============================================
  # Build job - creates all artifacts
  # ============================================
  build:
    permissions:
      contents: read
    needs: release-integrity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        # Hash-pinned (SEC-042): the build's flatbuffers is the reviewed wheel.
        run: pip install --require-hashes -r .github/requirements/flatbuffers.txt

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Build all artifacts
        run: npm run build

      - name: Get version
        id: version
        env:
          # Through the environment, never expanded into the script text
          # (security audit SEC-044). Every publish job interpolates this
          # output, so it is validated as a plain semver here, once.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version is the tag this run builds, never a typed label.
          case "$REF" in
            refs/tags/v*) TAG="${REF#refs/tags/}" ;;
            *) echo "::error::publish runs only on a v* tag (ref $REF); dispatch it on the tag"; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_TAG" != "$TAG" ]; then
            echo "::error::release tag '$RELEASE_TAG' is not the ref '$TAG'"
            exit 1
          fi
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a release version (MAJOR.MINOR.PATCH[-pre])"
            exit 1
          fi
          # The tagged tree says the same version (read from the commit: the
          # build may touch the working copy)...
          PACKAGE_VERSION="$(git show HEAD:package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version.split('+')[0])")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is $PACKAGE_VERSION at $TAG, not $VERSION"
            exit 1
          fi
          # ...and the tagged commit is on main, not an unreviewed branch.
          ON_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/compare/refs/heads/main...${GITHUB_SHA}" --jq .status)" || ON_MAIN=unknown
          if [ "$ON_MAIN" != identical ] && [ "$ON_MAIN" != behind ]; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main ($ON_MAIN)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload lib artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lib-artifacts
          path: lib/
          retention-days: 1

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 1

  # ============================================
  # npm (JavaScript/TypeScript) - npmjs.org
  # ============================================
  publish-npm:
    # npm trusted publishing should require this environment (npmjs.com).
    environment: npm-publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      github.event_name == 'release' ||
      contains(inputs.packages, 'npm') ||
      inputs.packages == 'all'
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # An exact npm (>= 11.5.1 for OIDC trusted publishing), never the moving
      # @latest, in the job that holds the id-token (security audit SEC-042).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.20.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version
        run: |
          npm version ${{ needs.build.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public --tag latest

  # ============================================
  # GitHub Packages (npm)
  # ============================================
  publish-github-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      github.event_name == 'release' ||
      contains(inputs.packages, 'npm') ||
      inputs.packages == 'all'
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@digitalarsenal'

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      - name: Install dependencies
        run: npm ci

      - name: Configure package for GitHub Packages
        run: |
          # Update package.json for GitHub Packages (scoped package and version)
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@digitalarsenal/spacedatastandards';
            pkg.version = '${{ needs.build.outputs.version }}';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # PyPI (Python)
  # ============================================
  # PyPI is not an intended target unless the PYPI_ENABLED repository variable
  # is 'true' (owner decision 2026-09-22): the project still carries legacy
  # 23.3.3.0.3.x releases that sort above every 1.x version, so publishing 1.x
  # there is refused until those are yanked.
  publish-pypi:
    # PyPI trusted publishing should require this environment.
    environment: pypi
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      vars.PYPI_ENABLED == 'true' && (
        github.event_name == 'release' ||
        contains(inputs.packages, 'pypi') ||
        inputs.packages == 'all'
      )
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      # Hash-pinned (SEC-042), in the job that holds the PyPI id-token. The
      # build runs --no-isolation so it uses these pins instead of fetching
      # setuptools/wheel unpinned into an isolated environment.
      - name: Install build tools
        run: pip install --require-hashes -r .github/requirements/publish-pypi.txt

      - name: Guard against a version that would not sort as PyPI's newest
        # sds-registry-latest-pointer-poisoned: four v23.3.3.0.3.x releases,
        # cut in error under an incompatible major-version scheme, PEP-440-sort
        # ABOVE every real 1.x release forever and permanently poisoned PyPI's
        # `latest` pointer (pip install resolves to a 2026-03 build, not the
        # newest tag). This refuses to repeat that class of mistake: any
        # version that would not become PyPI's highest-sorting release fails
        # the publish BEFORE upload, naming the release that outranks it.
        run: |
          set -euo pipefail
          PEP440_VERSION=$(echo "${{ needs.build.outputs.version }}" | tr '-' '.' | cut -d+ -f1)
          python3 - "$PEP440_VERSION" <<'PYEOF'
          import json, sys, urllib.request
          from packaging.version import Version, InvalidVersion

          new_version = sys.argv[1]
          try:
              new = Version(new_version)
          except InvalidVersion as e:
              print(f"::error::new version '{new_version}' is not a valid PEP 440 version: {e}")
              sys.exit(1)

          try:
              with urllib.request.urlopen("https://pypi.org/pypi/spacedatastandards.org/json", timeout=15) as r:
                  data = json.load(r)
          except Exception as e:
              print(f"::warning::could not reach PyPI to check existing releases ({e}); proceeding without the guard")
              sys.exit(0)

          higher = []
          for v, files in data.get("releases", {}).items():
              try:
                  parsed = Version(v)
              except InvalidVersion:
                  continue
              # A yanked release no longer competes for `latest` (pip skips it
              # unless pinned), so a legacy version the owner has yanked does
              # not block the next real release.
              if files and all(f.get("yanked") for f in files):
                  continue
              if parsed > new:
                  higher.append(v)

          if higher:
              higher.sort(key=Version, reverse=True)
              print(
                  f"::error::refusing to publish {new_version}: PyPI already carries {len(higher)} "
                  f"HIGHER-sorting release(s), topped by {higher[0]}. Publishing now would not become "
                  f"'latest' and would repeat the v23.3.3-0.3.x pointer-poisoning incident "
                  f"(sds-registry-latest-pointer-poisoned). If {higher[0]} etc. are legacy "
                  f"mis-published versions, yank them on PyPI first (owner action, needs PyPI "
                  f"credentials; a yanked release is ignored here), then re-run this workflow."
              )
              sys.exit(1)

          print(f"OK: {new_version} sorts above every existing PyPI release.")
          PYEOF

      - name: Create pyproject.toml
        run: |
          # Convert semver to PEP 440:
          #   - replace '-' with '.' (e.g., 23.3.3-0.3.1 -> 23.3.3.0.3.1)
          #   - strip '+buildmeta' (PyPI rejects PEP 440 local-version segments)
          PEP440_VERSION=$(echo "${{ needs.build.outputs.version }}" | tr '-' '.' | cut -d+ -f1)
          cat > lib/py/pyproject.toml << EOF
          [build-system]
          requires = ["setuptools>=61.0", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "spacedatastandards.org"
          version = "${PEP440_VERSION}"
          description = "Space data standards framework based on CCSDS standards and Google FlatBuffers"
          readme = "README.md"
          license = {text = "Apache-2.0"}
          authors = [
              {name = "Digital Arsenal", email = "sds@digitalarsenal.io"}
          ]
          keywords = ["space", "flatbuffers", "ccsds", "satellite", "orbital-mechanics", "ssa"]
          classifiers = [
              "Development Status :: 4 - Beta",
              "Intended Audience :: Science/Research",
              "License :: OSI Approved :: Apache Software License",
              "Programming Language :: Python :: 3",
              "Programming Language :: Python :: 3.8",
              "Programming Language :: Python :: 3.9",
              "Programming Language :: Python :: 3.10",
              "Programming Language :: Python :: 3.11",
              "Programming Language :: Python :: 3.12",
              "Topic :: Scientific/Engineering :: Astronomy",
          ]
          requires-python = ">=3.8"
          dependencies = [
              "flatbuffers>=23.3.3",
          ]

          [project.urls]
          Homepage = "https://spacedatastandards.org"
          Repository = "https://github.com/DigitalArsenal/spacedatastandards.org"
          Documentation = "https://digitalarsenal-io-inc.gitbook.io/spacedatastandards.org/"

          [tool.setuptools.packages.find]
          where = ["."]
          EOF

      - name: Create README for PyPI
        run: |
          cat > lib/py/README.md << 'EOF'
          # Space Data Standards (Python)

          High-performance FlatBuffers schemas for space data exchange.

          ## Installation

          ```bash
          pip install spacedatastandards
          ```

          ## Usage

          ```python
          import flatbuffers
          from spacedatastandards.OMM import OMM

          # Create a builder
          builder = flatbuffers.Builder(1024)

          # Build your message...
          ```

          ## Documentation

          - [Website](https://spacedatastandards.org)
          - [GitBook](https://digitalarsenal-io-inc.gitbook.io/spacedatastandards.org/)
          - [GitHub](https://github.com/DigitalArsenal/spacedatastandards.org)
          EOF

      - name: Build Python package
        run: |
          cd lib/py
          python -m build --no-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: lib/py/dist/

  # ============================================
  # crates.io (Rust)
  # ============================================
  publish-cargo:
    # Registry credentials live in the crates-io environment, behind the owner's
    # required reviewers; a branch workflow cannot read them.
    environment: crates-io
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      github.event_name == 'release' ||
      contains(inputs.packages, 'cargo') ||
      inputs.packages == 'all'
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-15
        with:
          # Pinned by SHA, the action cannot read the toolchain from its ref.
          toolchain: stable

      - name: Setup Node.js (for Cargo.toml generation)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      - name: Generate Cargo package structure
        run: node scripts/generateCargoPackage.js

      - name: Update Cargo.toml version
        run: |
          cd lib/rs
          sed -i 's/version = "0.1.0"/version = "${{ needs.build.outputs.version }}"/' Cargo.toml

      - name: Publish to crates.io
        run: |
          cd lib/rs
          cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  # ============================================
  # pub.dev (Dart)
  # ============================================
  publish-dart:
    # Registry credentials live in the pub-dev environment, behind the owner's
    # required reviewers; a branch workflow cannot read them.
    environment: pub-dev
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      github.event_name == 'release' ||
      contains(inputs.packages, 'dart') ||
      inputs.packages == 'all'
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      - name: Create pubspec.yaml
        run: |
          cat > lib/dart/pubspec.yaml << 'EOF'
          name: spacedatastandards
          version: ${{ needs.build.outputs.version }}
          description: Space data standards framework based on CCSDS and FlatBuffers
          repository: https://github.com/DigitalArsenal/spacedatastandards.org
          homepage: https://spacedatastandards.org

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flat_buffers: ^23.5.26
          EOF

      - name: Create LICENSE
        run: |
          cat > lib/dart/LICENSE << 'LICEOF'
          Apache License
          Version 2.0, January 2004
          http://www.apache.org/licenses/

          TERMS AND CONDITIONS FOR USE, REPRODUCTION, AND DISTRIBUTION

          1. Definitions.

          "License" shall mean the terms and conditions for use, reproduction,
          and distribution as defined by Sections 1 through 9 of this document.

          "Licensor" shall mean the copyright owner or entity authorized by
          the copyright owner that is granting the License.

          "Legal Entity" shall mean the union of the acting entity and all
          other entities that control, are controlled by, or are under common
          control with that entity.

          "You" (or "Your") shall mean an individual or Legal Entity
          exercising permissions granted by this License.

          "Source" form shall mean the preferred form for making modifications.

          "Object" form shall mean any form resulting from mechanical
          transformation or translation of a Source form.

          "Work" shall mean the work of authorship made available under the License.

          "Derivative Works" shall mean any work that is based on the Work.

          "Contribution" shall mean any work of authorship submitted for
          inclusion in the Work by the copyright owner.

