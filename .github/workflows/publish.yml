          LICEOF

      - name: Create README for pub.dev
        run: |
          cat > lib/dart/README.md << 'EOF'
          # Space Data Standards (Dart)

          High-performance FlatBuffers schemas for space data exchange.

          ## Installation

          ```yaml
          dependencies:
            spacedatastandards: ^${{ needs.build.outputs.version }}
          ```

          ## Documentation

          - [Website](https://spacedatastandards.org)
          - [GitHub](https://github.com/DigitalArsenal/spacedatastandards.org)
          EOF

      - name: Create CHANGELOG
        run: |
          cat > lib/dart/CHANGELOG.md << 'EOF'
          ## ${{ needs.build.outputs.version }}

          - Updated schemas to version ${{ needs.build.outputs.version }}
          EOF

      - name: Setup pub credentials
        run: |
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS" > ~/.config/dart/pub-credentials.json
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}

      - name: Publish to pub.dev
        run: |
          cd lib/dart
          dart pub publish --force

  # ============================================
  # Maven Central (Java)
  # ============================================
  publish-maven-java:
    # Registry credentials live in the maven-central environment, behind the owner's
    # required reviewers; a branch workflow cannot read them.
    environment: maven-central
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    env:
      MAVEN_GROUP_ID: ${{ vars.MAVEN_GROUP_ID }}
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      github.event_name == 'release' ||
      contains(inputs.packages, 'maven') ||
      inputs.packages == 'all'
      )
    steps:
      - name: Check Maven Central configuration
        id: maven-config
        run: |
          if [ -z "${MAVEN_GROUP_ID}" ]; then
            echo "MAVEN_GROUP_ID is not configured; Java/Maven Central is not an intended target for this release."
            echo "Configure MAVEN_GROUP_ID to a Central-verified namespace to make Maven a required publication target."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Publishing Maven artifacts as ${MAVEN_GROUP_ID}:spacedatastandards."
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.maven-config.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Setup Java
        if: steps.maven-config.outputs.enabled == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Download artifacts
        if: steps.maven-config.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      - name: Create pom.xml
        if: steps.maven-config.outputs.enabled == 'true'
        run: |
          cat > lib/java/pom.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>${MAVEN_GROUP_ID}</groupId>
              <artifactId>spacedatastandards</artifactId>
              <version>${{ needs.build.outputs.version }}</version>
              <packaging>jar</packaging>

              <name>Space Data Standards</name>
              <description>Space data standards framework based on CCSDS and FlatBuffers</description>
              <url>https://spacedatastandards.org</url>

              <licenses>
                  <license>
                      <name>Apache License, Version 2.0</name>
                      <url>http://www.apache.org/licenses/LICENSE-2.0</url>
                  </license>
              </licenses>

              <developers>
                  <developer>
                      <name>Digital Arsenal</name>
                      <email>sds@digitalarsenal.io</email>
                      <organization>Digital Arsenal</organization>
                      <organizationUrl>https://digitalarsenal.io</organizationUrl>
                  </developer>
              </developers>

              <scm>
                  <connection>scm:git:git://github.com/DigitalArsenal/spacedatastandards.org.git</connection>
                  <developerConnection>scm:git:ssh://github.com:DigitalArsenal/spacedatastandards.org.git</developerConnection>
                  <url>https://github.com/DigitalArsenal/spacedatastandards.org</url>
              </scm>

              <dependencies>
                  <dependency>
                      <groupId>com.google.flatbuffers</groupId>
                      <artifactId>flatbuffers-java</artifactId>
                      <version>25.2.10</version>
                  </dependency>
              </dependencies>

              <build>
                  <sourceDirectory>.</sourceDirectory>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <source>11</source>
                              <target>11</target>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-source-plugin</artifactId>
                          <version>3.3.0</version>
                          <executions>
                              <execution>
                                  <id>attach-sources</id>
                                  <goals>
                                      <goal>jar-no-fork</goal>
                                  </goals>
                              </execution>
                          </executions>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-javadoc-plugin</artifactId>
                          <version>3.6.0</version>
                          <executions>
                              <execution>
                                  <id>attach-javadocs</id>
                                  <goals>
                                      <goal>jar</goal>
                                  </goals>
                              </execution>
                          </executions>
                          <configuration>
                              <doclint>none</doclint>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-gpg-plugin</artifactId>
                          <version>3.1.0</version>
                          <executions>
                              <execution>
                                  <id>sign-artifacts</id>
                                  <phase>verify</phase>
                                  <goals>
                                      <goal>sign</goal>
                                  </goals>
                              </execution>
                          </executions>
                          <configuration>
                              <gpgArguments>
                                  <arg>--pinentry-mode</arg>
                                  <arg>loopback</arg>
                              </gpgArguments>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

      - name: Add Java package declarations and restructure
        if: steps.maven-config.outputs.enabled == 'true'
        run: |
          cd lib/java
          for dir in */; do
            pkg="${dir%/}"
            # Create package directory structure
            mkdir -p "io/spacedatastandards/${pkg}"
            for f in "${dir}"*.java; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              # Add package declaration at the top of each file
              { echo "package io.spacedatastandards.${pkg};"; echo ""; cat "$f"; } > "io/spacedatastandards/${pkg}/${fname}"
            done
            # Remove original directory
            rm -rf "$dir"
          done

      - name: Fix Java byte overflow in union types
        if: steps.maven-config.outputs.enabled == 'true'
        run: |
          # FlatBuffers unions with >127 members overflow Java's signed byte.
          # Change RecordType constants from byte to int to support >127 union members.
          find lib/java -name 'RecordType.java' -exec sed -i 's/public static final byte/public static final int/g' {} +

      - name: Align ValidateVersion to Maven-available runtime
        if: steps.maven-config.outputs.enabled == 'true'
        run: |
          # flatc 25.12.19 emits Constants.FLATBUFFERS_25_12_19() version-compat
          # checks, but Google has not published flatbuffers-java:25.12.19 to
          # Maven Central (latest is 25.2.10). Rewrite to the available runtime.
          find lib/java -name '*.java' -exec sed -i 's/FLATBUFFERS_25_12_19/FLATBUFFERS_25_2_10/g' {} +

      - name: Build and sign artifacts
        if: steps.maven-config.outputs.enabled == 'true'
        run: |
          cd lib/java
          mvn clean verify -DskipTests
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create bundle for Central Portal
        if: steps.maven-config.outputs.enabled == 'true'
        run: |
          cd lib/java/target
          VERSION="${{ needs.build.outputs.version }}"
          GROUP_PATH="${MAVEN_GROUP_ID//./\/}"
          # Create the bundle directory structure
          BUNDLE_DIR="${GROUP_PATH}/spacedatastandards/${VERSION}"
          mkdir -p "${BUNDLE_DIR}"
          # Copy artifacts
          cp "spacedatastandards-${VERSION}.jar" "${BUNDLE_DIR}/"
          cp "spacedatastandards-${VERSION}.pom" "${BUNDLE_DIR}/" 2>/dev/null || cp ../pom.xml "${BUNDLE_DIR}/spacedatastandards-${VERSION}.pom"
          cp "spacedatastandards-${VERSION}-sources.jar" "${BUNDLE_DIR}/" 2>/dev/null || true
          cp "spacedatastandards-${VERSION}-javadoc.jar" "${BUNDLE_DIR}/" 2>/dev/null || true
          # Copy signatures
          for f in "${BUNDLE_DIR}"/*.jar "${BUNDLE_DIR}"/*.pom; do
            [ -f "$f" ] || continue
            if [ ! -f "$f.asc" ]; then
              gpg --armor --detach-sign "$f"
            fi
            # Generate checksums
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done
          # Central Portal bundles must preserve the full Maven repository path
          # from the archive root: groupId/artifactId/version/artifacts.
          zip -r "${GITHUB_WORKSPACE}/bundle.zip" "${GROUP_PATH}/spacedatastandards/${VERSION}/"

      - name: Upload bundle to Central Portal
        if: steps.maven-config.outputs.enabled == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          # Upload via Central Portal API
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -u "${MAVEN_USERNAME}:${MAVEN_PASSWORD}" \
            -F "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=spacedatastandards-${{ needs.build.outputs.version }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Upload failed with status $HTTP_CODE"
            exit 1
          fi
          DEPLOYMENT_ID="$BODY"
          echo "Deployment ID: $DEPLOYMENT_ID"

          for attempt in $(seq 1 60); do
            STATUS_RESPONSE=$(curl -sS -w "\n%{http_code}" \
              -u "${MAVEN_USERNAME}:${MAVEN_PASSWORD}" \
              -X POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")
            STATUS_CODE=$(echo "$STATUS_RESPONSE" | tail -1)
            STATUS_BODY=$(echo "$STATUS_RESPONSE" | head -n -1)
            echo "Central deployment status attempt ${attempt}: HTTP ${STATUS_CODE} ${STATUS_BODY}"
            if [ "$STATUS_CODE" -ge 400 ]; then
              echo "Central status check failed with status $STATUS_CODE"
              exit 1
            fi
            DEPLOYMENT_STATE=$(node -e "const input = process.argv[1] || '{}'; const body = JSON.parse(input); console.log(body.deploymentState || body.state || body.status || 'UNKNOWN')" "$STATUS_BODY")
            case "$DEPLOYMENT_STATE" in
              PUBLISHED)
                echo "Central deployment published."
                exit 0
                ;;
              FAILED)
                echo "Central deployment failed."
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Central deployment did not publish before the timeout."
          exit 1

  # ============================================
  # Go Modules (tag-based)
  # ============================================
  publish-go:
    # The one job that writes to this repository: in the go-modules
    # environment, behind the owner's required reviewers.
    environment: go-modules
    permissions:
      contents: write # pushes the lib/go/v* module tag
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      github.event_name == 'release' ||
      contains(inputs.packages, 'go') ||
      inputs.packages == 'all'
      )
    steps:
      # Shallow checkout: the job compares lib/go at HEAD and tags HEAD, a
      # commit the remote already has; it never needs history (see
      # release-integrity).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update go.mod version
        run: |
          cd lib/go
          cat > go.mod << EOF
          module github.com/DigitalArsenal/spacedatastandards.org/lib/go

          go 1.21

          require github.com/google/flatbuffers v25.12.19+incompatible

          retract (
          	v23.3.3-0.3.7+incompatible // published in error under an incompatible major-version scheme; use a 1.x release
          	v23.3.3-0.3.6+incompatible // published in error under an incompatible major-version scheme; use a 1.x release
          	v23.3.3-0.3.5+incompatible // published in error under an incompatible major-version scheme; use a 1.x release
          	v23.3.3-0.3.4+incompatible // published in error under an incompatible major-version scheme; use a 1.x release
          	v23.3.3-0.3.3+incompatible // published in error under an incompatible major-version scheme; use a 1.x release
          	v23.3.3-0.3.2+incompatible // published in error under an incompatible major-version scheme; use a 1.x release
          	v23.3.3-0.3.1+incompatible // published in error under an incompatible major-version scheme; use a 1.x release
          )
          EOF

      - name: Create and push Go module tag
        run: |
          VERSION="v${{ needs.build.outputs.version }}"
          git add lib/go/
          git diff --cached --exit-code lib/go/ || {
            echo "Generated Go module differs from committed lib/go artifacts."
            echo "Commit regenerated lib/go before creating an SDS release."
            exit 1
          }
          # A module tag is immutable: the Go proxy and checksum database
          # already hold what it named. Never move one; an existing tag on
          # this commit is done, on any other commit it is an error.
          existing="$(git ls-remote --tags origin "refs/tags/lib/go/${VERSION}^{}" "refs/tags/lib/go/${VERSION}" | awk 'NR==1 || /\^\{\}$/ { sha = $1 } END { print sha }')"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$(git rev-parse HEAD)" ]; then
              echo "lib/go/${VERSION} already names this commit"
              exit 0
            fi
            echo "::error::lib/go/${VERSION} already exists on another commit ($existing); refusing to move it"
            exit 1
          fi
          git tag "lib/go/${VERSION}"
          # The checkout persists no credentials; the token authenticates this
          # one push and nothing else.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin "refs/tags/lib/go/${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # PHP (Packagist - auto-updates from tags)
  # ============================================
  publish-php:
    # Registry credentials live in the packagist environment, behind the owner's
    # required reviewers; a branch workflow cannot read them.
    environment: packagist
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      startsWith(github.ref, 'refs/tags/v') && (
      github.event_name == 'release' ||
      contains(inputs.packages, 'php') ||
      inputs.packages == 'all'
      )
    steps:
      - name: Check Packagist credentials
        id: creds
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "PACKAGIST_USERNAME and PACKAGIST_TOKEN are not configured; PHP/Packagist is not an intended target for this release."
            echo "Configure both secrets to make Packagist a required publication target."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Shallow (default depth-1) checkout: this job only reads composer.json
      # at HEAD and never needs history. A fetch-depth:0 clone of this repo
      # (>3GB with every release's regenerated bindings) hung actions/checkout
      # for 55-90 min on v1.177.0 — see sds-publish-php-checkout-hang.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false

      - name: Download artifacts
        if: steps.creds.outputs.configured == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib-artifacts
          path: lib/

      - name: Create and validate Packagist metadata
        if: steps.creds.outputs.configured == 'true'
        run: |
          test -f composer.json
          php -r 'json_decode(file_get_contents("composer.json"), true); if (json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, json_last_error_msg() . PHP_EOL); exit(1); }'

      - name: Register or update Packagist package
        if: steps.creds.outputs.configured == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          REPO_URL="https://github.com/DigitalArsenal/spacedatastandards.org"
          AUTH="Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}"
          CREATE_RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "$AUTH" \
            https://packagist.org/api/create-package \
            -d "{\"repository\":\"${REPO_URL}\"}")
          CREATE_CODE=$(echo "$CREATE_RESPONSE" | tail -1)
          CREATE_BODY=$(echo "$CREATE_RESPONSE" | head -n -1)
          echo "Create HTTP Status: $CREATE_CODE"
          echo "Create Response: $CREATE_BODY"
          if [ "$CREATE_CODE" -ge 400 ]; then
            UPDATE_RESPONSE=$(curl -sS -w "\n%{http_code}" \
              -X PUT \
              -H "Content-Type: application/json" \
              -H "$AUTH" \
              https://packagist.org/api/packages/digitalarsenal/spacedatastandards \
              -d "{\"repository\":\"${REPO_URL}\"}")
            UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -1)
            UPDATE_BODY=$(echo "$UPDATE_RESPONSE" | head -n -1)
            echo "Update HTTP Status: $UPDATE_CODE"
            echo "Update Response: $UPDATE_BODY"
            if [ "$UPDATE_CODE" -ge 400 ]; then
              echo "Packagist create/update failed."
              exit 1
            fi
          fi

  # ============================================
  # Summary job
  # ============================================
  # ============================================
  # Post-deploy verification - the site must actually render
  # ============================================
  verify-live-site:
    permissions:
      contents: read
    needs:
      - build
      - publish-npm
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-artifacts
          path: dist/

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the live site serves and renders this release
        run: npm run verify:live -- --wait 900 --artifact-dir "$RUNNER_TEMP/verify-live"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-live-site-evidence
          path: ${{ runner.temp }}/verify-live
          if-no-files-found: ignore
          retention-days: 7

  publish-summary:
    permissions: {}
    needs:
      - build
      - publish-npm
      - publish-github-npm
      - publish-pypi
      - publish-cargo
      - publish-dart
      - publish-maven-java
      - publish-go
      - publish-php
      - release-integrity
      - verify-live-site
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Publish Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm (npmjs.org) | ${{ needs.publish-npm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm (GitHub Packages) | ${{ needs.publish-github-npm.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ vars.PYPI_ENABLED }}" = "true" ]; then
            echo "| PyPI | ${{ needs.publish-pypi.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| PyPI | not configured (PYPI_ENABLED is not 'true') |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| crates.io | ${{ needs.publish-cargo.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pub.dev | ${{ needs.publish-dart.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven Central | ${{ needs.publish-maven-java.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Modules | ${{ needs.publish-go.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PHP/Packagist | ${{ needs.publish-php.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release integrity (pre-build) | ${{ needs.release-integrity.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Live site verification (post-publish) | ${{ needs.verify-live-site.result }} |" >> $GITHUB_STEP_SUMMARY
