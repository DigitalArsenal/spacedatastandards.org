version: 2
updates:
  # The workflows' actions are pinned to full commit SHAs (security audit
  # SEC-042); Dependabot keeps those pins current with reviewable PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
  # The hash-pinned Python tools in .github/requirements/ (security audit
  # SEC-042): Dependabot proposes new pins, hashes included, as reviewable PRs.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
