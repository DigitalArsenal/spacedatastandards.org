                encrypted while headers and routing information remain readable. The canonical
                recipient flow is header-first: send <code>$ENC</code> first, then send the
                encrypted payload, typically wrapped in <code>$REC</code> so the receiver knows
                which generated schema to consume for the decrypt step.`,s=k(),i=m("div"),l=m("pre"),l.textContent=`
+----------------------------------------------+
| 1. $ENC Header (sent first, unencrypted)     |
+----------------------------------------------+
| KEY_EXCHANGE: X25519                         |
| EPHEMERAL_PUBLIC_KEY: sender ephemeral key   |
| NONCE_START: random nonce base               |
| ROOT_TYPE: "KMF" (or other generated type)   |
| CONTEXT: recipient / application domain      |
+----------------------------------------------+
| 2. $REC Wrapper (payload selector)           |
+----------------------------------------------+
| RECORD_TYPE: KMF                             |
| RECORD_BYTES: encrypted generated payload    |
+----------------------------------------------+
| 3. Encrypted Payload                         |
+----------------------------------------------+
| KMF {                                        |
|   KEY_ID: "module/dek/default"               |
|   KEY_BYTES: [ENCRYPTED FIELD]               |
|   EXPIRES_AT: 1760000000000                  |
| }                                            |
+----------------------------------------------+
| 4. Bob Decrypt                               |
+----------------------------------------------+
| Read $ENC first                              |
| Read $REC to locate/generated root type      |
| Derive shared secret with recipient key      |
| Decrypt encrypted fields in payload          |
| Consume generated KMF/REC bindings locally   |
+----------------------------------------------+`,a=k(),c=m("h3"),c.textContent="Header-First Recipient Encryption",d=k(),p=m("div"),p.innerHTML='<div class="encrypt-card svelte-1edf6l2"><h4 class="svelte-1edf6l2">$ENC First</h4> <p class="svelte-1edf6l2">The encryption header is transmitted before the payload so the receiver can derive the correct decrypt context before touching encrypted fields.</p></div> <div class="encrypt-card svelte-1edf6l2"><h4 class="svelte-1edf6l2">$REC Consumption</h4> <p class="svelte-1edf6l2">The encrypted payload should be carried in the generated <code>$REC</code> wrapper so Bob can identify the generated schema type and run the correct decrypt path.</p></div> <div class="encrypt-card svelte-1edf6l2"><h4 class="svelte-1edf6l2">Per-Field Protection</h4> <p class="svelte-1edf6l2">Fields marked <code>(encrypted)</code> stay in their generated FlatBuffer layout while sensitive bytes, such as <code>KMF.KEY_BYTES</code>, are protected for the intended recipient.</p></div>',g=k(),h=m("h3"),h.textContent="Bob Decrypt Checklist",_=k(),u=m("div"),u.innerHTML='<div class="use-case svelte-1edf6l2"><span class="use-case-icon svelte-1edf6l2">1</span> <div><strong class="svelte-1edf6l2">Read <code>$ENC</code> Before Payload</strong> <p class="svelte-1edf6l2">Bob must parse the encryption header first to recover the ephemeral public key, nonce base, and generated root type information.</p></div></div> <div class="use-case svelte-1edf6l2"><span class="use-case-icon svelte-1edf6l2">2</span> <div><strong class="svelte-1edf6l2">Consume the Generated <code>$REC</code> Wrapper</strong> <p class="svelte-1edf6l2">The payload should be consumed through generated <code>REC</code> bindings so Bob can resolve the record type and dispatch to the correct generated schema before decrypting fields.</p></div></div> <div class="use-case svelte-1edf6l2"><span class="use-case-icon svelte-1edf6l2">3</span> <div><strong class="svelte-1edf6l2">Decrypt Encrypted Fields In-Place</strong> <p class="svelte-1edf6l2">Once Bob derives the shared secret from the header, he decrypts the encrypted fields in the generated payload buffer and then reads the normal generated object graph.</p></div></div>',E=k(),f=m("h3"),f.textContent="Use Cases",T=k(),b=m("div"),b.innerHTML='<div class="use-case svelte-1edf6l2"><span class="use-case-icon svelte-1edf6l2">1</span> <div><strong class="svelte-1edf6l2">Public Network Distribution</strong> <p class="svelte-1edf6l2">Share CDM messages on public networks where routing information must be visible but collision details are protected.</p></div></div> <div class="use-case svelte-1edf6l2"><span class="use-case-icon svelte-1edf6l2">2</span> <div><strong class="svelte-1edf6l2">Multi-Party Access Control</strong> <p class="svelte-1edf6l2">Different fields encrypted for different recipients. Satellite operators see their own data, regulators see aggregate statistics.</p></div></div> <div class="use-case svelte-1edf6l2"><span class="use-case-icon svelte-1edf6l2">3</span> <div><strong class="svelte-1edf6l2">Audit-Friendly Sharing</strong> <p class="svelte-1edf6l2">Message metadata remains visible for logging and compliance while payload stays confidential.</p></div></div>',r(t,"class","intro-text svelte-1edf6l2"),r(l,"class","ascii-diagram svelte-1edf6l2"),r(i,"class","encryption-diagram svelte-1edf6l2"),r(c,"class","subsection-title svelte-1edf6l2"),r(p,"class","encryption-features svelte-1edf6l2"),r(h,"class","subsection-title svelte-1edf6l2"),r(u,"class","use-case-list svelte-1edf6l2"),r(f,"class","subsection-title svelte-1edf6l2"),r(b,"class","use-case-list svelte-1edf6l2"),r(e,"class","section-content svelte-1edf6l2")},m(y,S){Z(y,e,S),o(e,t),o(e,s),o(e,i),o(i,l),o(e,a),o(e,c),o(e,d),o(e,p),o(e,g),o(e,h),o(e,_),o(e,u),o(e,E),o(e,f),o(e,T),o(e,b)},d(y){y&&J(e)}}}function Xi(n){let e,t,s,i,l,a,c,d,p,g,h,_,u,E,f,T,b,y,S,O,A,D,R,N,j,V;return{c(){e=m("div"),t=m("h3"),t.textContent="TLE to OMM Migration",s=k(),i=m("di   OMMT, CDMT, writeFB, readFB,
  parseTLE, parseXmlCdm, parseJsonOmm
} from 'spacedatastandards.org';

// Unified ingestion pipeline
async function ingestOrbitalData(source: string, format: string) {
  let messages: OMMT[];

  switch (format) {
    case 'tle':
      // Parse TLE and convert to OMM
      const tles = await fetch(source).then(r => r.text());
      messages = parseTLE(tles).map(tle => new OMMT({
        OBJECT_NAME: tle.name,
        OBJECT_ID: tle.noradId,
        EPOCH: tle.epoch,
        MEAN_MOTION: tle.meanMotion,
        // ... map all fields
      }));
      break;

    case 'xml':
      // Parse CCSDS XML OMM
      const xml = await fetch(source).then(r => r.text());
      messages = parseXmlOmm(xml);
      break;

    case 'json':
      // Parse JSON OMM (Space-Track format)
      const json = await fetch(source).then(r => r.json());
      messages = parseJsonOmm(json);
      break;

    case 'flatbuffer':
      // Already in optimal format - zero conversion
      const buffer = await fetch(source).then(r => r.arrayBuffer());
      return readFB(new Uint8Array(buffer));
  }

  // Convert all formats to FlatBuffer for storage/processing
  return writeFB(messages);
}`,D=k(),R=m("h3"),R.textContent="Working with XTC Telemetry",N=k(),j=m("div"),V=m("div"),V.textContent="TypeScript: XTC Parameter Access",ae=k(),w=m("pre"),w.textContent=`import { readFB } from 'spacedatastandards.org';
