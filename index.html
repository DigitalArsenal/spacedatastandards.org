}

// Key Components
table TelemetryMetaData {
  PARAMETER_TYPE_SET: ParameterTypeSet;   // Type definitions
  PARAMETER_SET: ParameterSet;            // Parameter instances
  CONTAINER_SET: ContainerSet;            // Packet definitions
  ALGORITHM_SET: AlgorithmSet;            // Processing rules

}`,b=k(),f=m("h3"),f.textContent="Benefits of XML XTCE to FlatBuffer XTC",T=k(),v=m("div"),v.innerHTML='<div class="benefit-item svelte-16tzn0g"><div class="benefit-header svelte-16tzn0g"><span class="benefit-number svelte-16tzn0g">10-50x</span> <span>Smaller Files</span></div> <p class="svelte-16tzn0g">Typical XTCE databases shrink from megabytes to hundreds of kilobytes.</p></div> <div class="benefit-item svelte-16tzn0g"><div class="benefit-header svelte-16tzn0g"><span class="benefit-number svelte-16tzn0g">100x</span> <span>Faster Loading</span></div> <p class="svelte-16tzn0g">No XML parsing required. Direct memory-mapped access to telemetry definitions.</p></div> <div class="benefit-item svelte-16tzn0g"><div class="benefit-header svelte-16tzn0g"><span class="benefit-number svelte-16tzn0g">Type-Safe</span> <span>Access</span></div> <p class="svelte-16tzn0g">Compile-time type checking for parameter types, encodings, and calibrations.</p></div> <div class="benefit-item svelte-16tzn0g"><div class="benefit-header svelte-16tzn0g"><span class="benefit-number svelte-16tzn0g">Embedded</span> <span>Friendly</span></div> <p class="svelte-16tzn0g">Small footprint suitable for on-board software and resource-constrained systems.</p></div>',y=k(),S=m("div"),O=m("a"),O.textContent="View XTC Schema",a(t,"class","xtce-intro svelte-16tzn0g"),a(i,"class","subsection-title svelte-16tzn0g"),a(l,"class","info-cards svelte-16tzn0g"),a(d,"class","subsection-title svelte-16tzn0g"),a(g,"class","intro-text svelte-16tzn0g"),a(h,"class","schema-code svelte-16tzn0g"),a(E,"class","schema-structure svelte-16tzn0g"),a(f,"class","subsection-title svelte-16tzn0g"),a(v,"class","benefit-comparison svelte-16tzn0g"),a(O,"href","/schemas/XTC"),a(O,"class","btn btn-accent svelte-16tzn0g"),a(S,"class","cta-inline svelte-16tzn0g"),a(e,"class","section-content svelte-16tzn0g")},m(R,N){Z(R,e,N),o(e,t),o(e,s),o(e,i),o(e,r),o(e,l),o(e,c),o(e,d),o(e,u),o(e,g),o(e,p),o(e,E),o(E,h),o(e,b),o(e,f),o(e,T),o(e,v),o(e                 encrypted while headers and routing information remain readable. The canonical
                recipient flow is header-first: send <code>$ENC</code> first, then send the
                encrypted payload, typically wrapped in <code>$REC</code> so the receiver knows
                which generated schema to consume for the decrypt step.`,s=k(),i=m("div"),r=m("pre"),r.textContent=`
+----------------------------------------------+
| 1. $ENC Header (sent first, unencrypted)     |
+----------------------------------------------+
| KEY_EXCHANGE: X25519                         |
| EPHEMERAL_PUBLIC_KEY: sender ephemeral key   |
| NONCE_START: random nonce base               |
| ROOT_TYPE: "KMF" (or other generated type)   |
| CONTEXT: recipient / application domain      |
+----------------------------------------------+
| 2. $REC Wrapper (payload selector)           |
+----------------------------------------------+
| RECORD_TYPE: KMF                             |
| RECORD_BYTES: encrypted generated payload    |
+----------------------------------------------+
| 3. Encrypted Payload                         |
+----------------------------------------------+
| KMF {                                        |
|   KEY_ID: "module/dek/default"               |
|   KEY_BYTES: [ENCRYPTED FIELD]               |
|   EXPIRES_AT: 1760000000000                  |
| }                                            |
+----------------------------------------------+
| 4. Bob Decrypt                               |
+----------------------------------------------+
| Read $ENC first                              |
| Read $REC to locate/generated root type      |
| Derive shared secret with recipient key      |
| Decrypt encrypted fields in payload          |
| Consume generated KMF/REC bindings locally   |
+----------------------------------------------+`,l=k(),c=m("h3"),c.textContent="Header-First Recipient Encryption",d=k(),u=m("div"),u.innerHTML='<div class="encrypt-card svelte-16tzn0g"><h4 class="svelte-16tzn0g">$ENC First</h4> <p class="svelte-16tzn0g">The encryption header is transmitted before the payload so the receiver can derive the correct decrypt context before touching encrypted fields.</p></div> <div class="encrypt-card svelte-16tzn0g"><h4 class="svelte-16tzn0g">$REC Consumption</h4> <p class="svelte-16tzn0g">The encrypted payload should be carried in the generated <code>$REC</code> wrapper so Bob can identify the generated schema type and run the correct decrypt path.</p></div> <div class="encrypt-card svelte-16tzn0g"><h4 class="svelte-16tzn0g">Per-Field Protection</h4> <p class="svelte-16tzn0g">Fields marked <code>(encrypted)</code> stay in their generated FlatBuffer layout while sensitive bytes, such as <code>KMF.KEY_BYTES</code>, are protected for the intended recipient.</p></div>',g=k(),p=m("h3"),p.textContent="Bob Decrypt Checklist",E=k(),h=m("div"),h.innerHTML='<div class="use-case svelte-16tzn0g"><span class="use-case-icon svelte-16tzn0g">1</span> <div><strong class="svelte-16tzn0g">Read <code>$ENC</code> Before Payload</strong> <p class="svelte-16tzn0g">Bob must parse the encryption header first to recover the ephemeral public key, nonce base, and generated root type information.</p></div></div> <div class="use-case svelte-16tzn0g"><span class="use-case-icon svelte-16tzn0g">2</span> <div><strong class="svelte-16tzn0g">Consume the Generated <code>$REC</code> Wrapper</strong> <p class="svelte-16tzn0g">The payload should be consumed through generated <code>REC</code> bindings so Bob can resolve the record type and dispatch to the correct generated schema before decrypting fields.</p></div></div> <div class="use-case svelte-16tzn0g"><span class="use-case-icon svelte-16tzn0g">3</span> <div><strong class="svelte-16tzn0g">Decrypt Encrypted Fields In-Place</strong> <p class="svelte-16tzn0g">Once Bob derives the shared secret from the header, he decrypts the encrypted fields in the generated payload buffer and then reads the normal generated object graph.</p></div></div>',b=k(),f=m("h3"),f.textContent="Use Cases",T=k(),v=m("div"),v.innerHTML='<div class="use-case svelte-16tzn0g"><span class="use-case-icon svelte-16tzn0g">1</span> <div><strong class="svelte-16tzn0g">Public Network Distribution</strong> <p class="svelte-16tzn0g">Share CDM messages on public networks where routing information must be visible but collision details are protected.</p></div></div> <div class="use-case svelte-16tzn0g"><span class="use-case-icon svelte-16tzn0g">2</span> <div><strong class="svelte-16tzn0g">Multi-Party Access Control</strong> <p class="svelte-16tzn0g">Different fields encrypted for different recipients. Satellite operators see their own data, regulators see aggregate statistics.</p></div></div> <div class="use-case svelte-16tzn0g"><span class="use-case-icon svelte-16tzn0g">3</span> <div><strong class="svelte-16tzn0g">Audit-Friendly Sharing</strong> <p class="svelte-16tzn0g">Message metadata remains visible for logging and compliance while payload stays confidential.</p></div></div>',a(t,"class","intro-text svelte-16tzn0g"),a(r,"class","ascii-diagram svelte-16tzn0g"),a(i,"class","encryption-diagram svelte-16tzn0g"),a(c,"class","subsection-title svelte-16tzn0g"),a(u,"class","encryption-features svelte-16tzn0g"),a(p,"class","subsection-title svelte-16tzn0g"),a(h,"class","use-case-list svelte-16tzn0g"),a(f,"class","subsection-title svelte-16tzn0g"),a(v,"class","use-case-list svelte-16tzn0g"),a(e,"class","section-content svelte-16tzn0g")},m(y,S){Z(y,e,S),o(e,t),o(e,s),o(e,i),o(i,r),o(e,l),o(e,c),o(e,d),o(e,u),o(e,g),o(e,p),o(e,E),o(e,h),o(e,b),o(e,f),o(e,T),o(e,v)},d(y){y&&J(e)}}}function Wi(n){let e,t,s,i,r,l,c,d,u,g,p,E,h,b,f,T,v,y,S,O,M,x,R,N,j,H;return{c(){e=m("div"),t=m("h3"),t.textContent="TLE to OMM Migration",s=k(),i=m("di         OBJECT_ID: tle.noradId,
        EPOCH: tle.epoch,
        MEAN_MOTION: tle.meanMotion,
        // ... map all fields
      }));
      break;

    case 'xml':
      // Parse CCSDS XML OMM
      const xml = await fetch(source).then(r => r.text());
      messages = parseXmlOmm(xml);
      break;

    case 'json':
      // Parse JSON OMM (Space-Track format)
      const json = await fetch(source).then(r => r.json());
      messages = parseJsonOmm(json);
      break;

    case 'flatbuffer':
      // Already in optimal format - zero conversion

  }
